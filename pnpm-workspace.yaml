allowBuilds:
  '@google/genai': false
  electron: true
  electron-winstaller: false
  esbuild: true
  protobufjs: false

overrides:
  postcss: ^8.5.15

# Keep native prebuilt dependencies for universal macOS packages and Windows
# x64 packaging. "current" retains the host platform and CPU for local dev/CI.
supportedArchitectures:
  os:
    - current
    - darwin
    - win32
  cpu:
    - current
    - x64
    - arm64
