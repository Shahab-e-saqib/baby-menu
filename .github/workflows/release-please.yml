name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      baby-menu-release-created: ${{ steps.release.outputs.release_created }}
      baby-menu-tag-name: ${{ steps.release.outputs.tag_name }}
      baby-menu-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.baby-menu-release-created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TAG_NAME: ${{ needs.release-please.outputs.baby-menu-tag-name }}
      VERSION: ${{ needs.release-please.outputs.baby-menu-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          BABY_MENU_UMAMI_HOST: https://a.kunchenguid.com
          BABY_MENU_UMAMI_WEBSITE_ID: ${{ vars.BABY_MENU_UMAMI_WEBSITE_ID }}
        run: pnpm build

      - name: Package macOS app
        run: pnpm exec electron-builder --mac dir --universal

      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - "release/mac-universal/Baby Menu.app"

      - name: Verify packaged runtime
        run: pnpm test:e2e:packaged-mac -- "release/mac-universal/Baby Menu.app"

      - name: Create DMG
        run: |
          DMG_NAME="Baby-Menu-${VERSION}-universal.dmg"
          hdiutil create -volname "Baby Menu" \
            -srcfolder "release/mac-universal/Baby Menu.app" \
            -ov -format UDZO "release/${DMG_NAME}"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"
          echo "DMG_PATH=release/${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" "$DMG_PATH" --clobber
