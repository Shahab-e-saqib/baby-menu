name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated contract types are up to date
        run: |
          set -eu
          pnpm generate:contracts
          if ! git diff --quiet -- extensions/babymenu-env.d.ts; then
            {
              echo "::error file=extensions/babymenu-env.d.ts::Generated contract types are out of date."
              echo "extensions/babymenu-env.d.ts no longer matches src/shared/contracts.ts."
              echo "Run 'pnpm generate:contracts' locally and commit the result."
              echo
              git --no-pager diff -- extensions/babymenu-env.d.ts
            } >&2
            exit 1
          fi
          echo "Generated contract types are up to date."

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  windows:
    # This gate runs the largest evidence-backed cross-platform subset. Tests
    # using Unix-only fixtures (symlinks, chmod permission bits, macOS tray,
    # Electron GUI) are skipped on win32. Scope and deferred validation are
    # owned by docs/windows-port-validation.md.
    # Deferred tests (each with concrete reason):
    #   e2e-acp-runtime.test.ts    - real ACP subprocess + git + acp-mock
    #   e2e-adapters.test.ts       - requires real Claude/Codex CLIs
    #   e2e-grok-quota-refresh     - requires real Grok OIDC creds
    #   app-lifecycle*.test.ts     - Electron GUI lifecycle
    #   tray.test.ts               - macOS tray / BrowserWindow
    #   popover-*.test.ts          - Electron BrowserWindow / screen bounds
    #   grok-quota-generated-install.test.ts - POSIX process-group signals
    #   renderer/*, widget-host, widget-canvas, agent-chat, settings-* - jsdom/React
    name: windows / typecheck / build / package / platform units
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Platform-safe unit tests
        run: |
          pnpm vitest run tests/shell-path.test.ts tests/launch-command.test.ts tests/platform-spawn.test.ts tests/process-tree.test.ts tests/dev-launcher.test.ts
          pnpm vitest run tests/adapter-claude-driver.test.ts tests/adapter-codex-driver.test.ts -t "delivers shell metacharacter prompts verbatim over stdin"
          pnpm vitest run tests/extension-database.test.ts tests/server-action-registry.test.ts tests/extension-seeder.test.ts tests/extension-module-compiler.test.ts tests/extension-contract-surface.test.ts tests/default-extension-inventory.test.ts tests/recipe-loader.test.ts
          pnpm vitest run tests/widget-module-registry.test.ts tests/widget-pipeline-integration.test.ts tests/widget-tailwind-css.test.ts tests/layout-module-registry.test.ts tests/widget-host-shim.test.ts tests/ui-export-contract.test.ts tests/ui-import-rewrite.test.ts
          # widget-protocol.test.ts deferred: imports electron at module load time,
          # and the Electron binary is a best-effort install-post script download
          # that is not guaranteed to succeed on every Windows runner. The test
          # logic (URL path resolution, regex) is cross-platform and covered by
          # the Ubuntu job.
          pnpm vitest run tests/agent-catalog.test.ts tests/agent-catalog-controller.test.ts tests/agent-runtime.test.ts tests/agent-runtime-distribution.test.ts tests/git-change-session.test.ts tests/dev-extension-change-session.test.ts tests/agent-turn-log.test.ts
          pnpm vitest run tests/preferences.test.ts tests/telemetry.test.ts tests/notifier.test.ts tests/update-checker.test.ts tests/background-task-scheduler.test.ts tests/ipc-capabilities.test.ts tests/contracts-types.test.ts tests/design-system-styles.test.ts tests/design-type-scale.test.ts tests/windows-unc-runtime.test.ts

      - name: Package Windows app and verify native runtime
        id: package
        shell: pwsh
        run: |
          pnpm exec electron-builder --win dir --x64 --config electron-builder.yml --publish never
          $packageDir = (Resolve-Path "release/win-unpacked").Path
          echo "dir=$packageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "BABY_MENU_WINDOWS_PACKAGE_DIR=$packageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $env:BABY_MENU_WINDOWS_PACKAGE_DIR = $packageDir
          pnpm vitest run tests/windows-packaging.test.ts

      - name: Packaged runtime persistence smoke
        id: runtime-smoke
        shell: pwsh
        continue-on-error: true
        run: |
          $diagDir = Join-Path $env:RUNNER_TEMP "baby-menu-runtime-smoke-diag"
          & "${{ github.workspace }}\scripts\Verify-BabyMenuRuntimeSmoke.ps1" -UnpackedDir "${{ steps.package.outputs.dir }}" -DiagnosticDir $diagDir

      - name: Upload runtime smoke diagnostic evidence
        if: steps.runtime-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: baby-menu-windows-runtime-smoke-evidence
          path: ${{ runner.temp }}\baby-menu-runtime-smoke-diag\*.json
          retention-days: 1
          if-no-files-found: warn

      - name: Fail job on runtime smoke failure
        if: steps.runtime-smoke.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Build x64 NSIS unsigned installer
        shell: pwsh
        run: pnpm exec electron-builder --win nsis --x64 --config electron-builder.yml --publish never

      - name: Verify NSIS unsigned artifact
        shell: pwsh
        run: |
          $installers = Get-ChildItem "release/Baby-Menu-*-x64-unsigned.exe"
          if ($installers.Count -ne 1) { throw "Expected exactly 1 unsigned NSIS installer, found $($installers.Count): $($installers.Name -join ', ')" }
          $installer = $installers[0]
          if ($installer.Length -eq 0) { throw "Installer $($installer.Name) is empty" }
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$($installer.Name) is not a valid Windows PE executable (missing MZ magic bytes)" }
          Write-Host "Verified: $($installer.Name) ($($installer.Length) bytes, valid PE)"

      - name: Upload unsigned NSIS installer for internal validation
        uses: actions/upload-artifact@v4
        with:
          name: baby-menu-unsigned-nsis-x64
          path: release/Baby-Menu-*-x64-unsigned.exe
          retention-days: 1
          if-no-files-found: error
