appId: com.kunchenguid.baby-menu
productName: Baby Menu
copyright: Copyright © 2026 Kun Chen

directories:
  output: release

files:
  - out/**
  - package.json
  - '!node_modules/esbuild/**'
  - '!node_modules/@esbuild/**'

extraResources:
  - from: extensions
    to: extensions-template
    filter:
      - AGENTS.md
      - babymenu-env.d.ts
      - recipes/**
      - hello-world/**
  - from: assets/tray
    to: tray
    filter:
      - baby_menuTemplate*.png
      - baby_menu.ico

asar: true

# The clean-room ACP adapters are spawned as standalone Node processes (via
# Electron-as-node) and cannot be read from inside app.asar, so keep them
# unpacked alongside the archive.
asarUnpack:
  - out/adapters/**

mac:
  category: public.app-category.developer-tools
  icon: assets/app-icon.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  x64ArchFiles: Contents/Resources/app.asar.unpacked/node_modules/{@tailwindcss/oxide-*/**,lightningcss-*/**,lightningcss/**}

win:
  icon: assets/app-icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  runAfterFinish: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Baby Menu
  artifactName: Baby-Menu-${version}-x64-unsigned.${ext}

dmg:
  artifactName: Baby-Menu-${version}-universal.dmg
